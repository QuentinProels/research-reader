<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Reader</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --ink: #1a1a1a; --muted: #6b6b6b;
    --line: #e2e0dc; --accent: #b4532a; --ok: #2f7d52; --bad: #b03030;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16151a; --panel:#1f1e25; --ink:#eceaf0; --muted:#9d9aa8;
            --line:#33313d; --accent:#e08a5f; --ok:#5fbf8a; --bad:#e07070; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 2px; letter-spacing:-.01em; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 22px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=file] { width:100%; padding:9px 11px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:.92rem; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
    padding:9px 16px; font-size:.9rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row > div { flex:1; }
  .hr { height:1px; background:var(--line); margin:16px 0; }
  .status { display:flex; gap:14px; font-size:.78rem; color:var(--muted); margin-bottom:16px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .paper { border-top:1px solid var(--line); padding:12px 0; }
  .paper:first-child { border-top:0; }
  .prow { display:flex; gap:10px; align-items:center; }
  .act { flex:0 0 auto; color:var(--muted); }
  .act:hover { border-color:var(--bad); color:var(--bad); }
  .paper h3 { margin:0 0 3px; font-size:.95rem; font-weight:600; }
  .meta { font-size:.76rem; color:var(--muted); }
  .bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:7px; }
  .bar span { display:block; height:100%; background:var(--accent); transition:width .4s; }
  .err { color:var(--bad); font-size:.8rem; margin-top:6px; }
  figure { margin:0 0 14px; }
  figure img { width:100%; border:1px solid var(--line); border-radius:8px; background:#fff; }
  figcaption { font-size:.78rem; color:var(--muted); margin-top:6px; }
  audio { width:100%; margin:10px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:999px; padding:4px 11px; font-size:.78rem; cursor:pointer; font-weight:400; }
  .chip.fig { border-color:var(--accent); color:var(--accent); }
  .back { background:none; color:var(--muted); padding:0; font-weight:400; font-size:.82rem; }
  .ptt { width:100%; margin-top:12px; padding:14px; font-size:.95rem; border-radius:10px;
    background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer;
    touch-action:none; user-select:none; }
  .ptt.live { background:var(--bad); }
  .ptt:disabled { opacity:.5; }
  .convo { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .turn { font-size:.86rem; padding:9px 12px; border-radius:10px; max-width:92%; }
  .turn.you { align-self:flex-end; background:var(--line); }
  .turn.reader { align-self:flex-start; border:1px solid var(--line); }
  .turn .who { display:block; font-size:.68rem; color:var(--muted); margin-bottom:3px; }
  .thinking { color:var(--muted); font-style:italic; }
  .settings { margin-bottom:16px; }
  .settings summary { cursor:pointer; font-size:.82rem; color:var(--muted); padding:4px 0; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:9px 0; border-top:1px solid var(--line); }
  .srow:first-of-type { border-top:0; }
  .srow label { margin:0; font-size:.86rem; color:var(--ink); flex:1; }
  .srow .why { display:block; font-size:.72rem; color:var(--muted); margin-top:2px; }
  .srow select { padding:6px 9px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:.82rem; }
  .sw { position:relative; width:42px; height:24px; flex:0 0 auto; }
  .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; background:var(--line); border-radius:24px;
    transition:.2s; cursor:pointer; }
  .sw span:before { content:""; position:absolute; height:18px; width:18px; left:3px;
    bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
  .sw input:checked + span { background:var(--accent); }
  .sw input:checked + span:before { transform:translateX(18px); }
  .mic { display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--line); margin-right:6px; vertical-align:middle; }
  .mic.hot { background:var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Research Reader</h1>
  <div class="sub">Papers in, narration out — figures described, not skipped.</div>
  <div class="status" id="status"></div>
  <div id="view"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clock = (s) => s == null ? "--:--"
  : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;

let openPaper = null, timer = null;

async function refreshStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("status").innerHTML = [["LLM", s.llm], ["TTS", s.tts], ["Worker", s.worker]].map(([name, v]) =>
      `<span><i class="dot" style="background:${v.ok ? "var(--ok)" : "var(--bad)"}"></i>${name}: ${esc(v.detail)}</span>`
    ).join("");
  } catch { $("status").textContent = "backend unreachable"; }
}

async function renderList() {
  const papers = await (await fetch("/api/papers")).json();

  // Build the ingest form exactly once. Rewriting it on every poll destroyed the
  // input the user was typing into and stole focus mid-keystroke.
  if (!$("ingest")) {
    $("view").innerHTML = `
      <div class="card" id="ingest">
        <label>Upload a PDF</label>
        <div class="row">
          <div><input type="file" id="file" accept="application/pdf"></div>
          <button id="up">Add</button>
        </div>
        <div class="hr"></div>
        <label>…or paste an arXiv / PDF link</label>
        <div class="row">
          <div><input type="text" id="url" placeholder="https://arxiv.org/abs/2401.12345"></div>
          <button id="go">Fetch</button>
        </div>
        <div class="err" id="ingestErr"></div>
      </div>
      <details class="card settings" id="settingsPanel">
        <summary>Settings</summary>
        <div id="settingsBody"></div>
      </details>
      <div class="card" id="papers"></div>`;

    $("up").onclick = async () => {
      const f = $("file").files[0];
      if (!f) return;
      const body = new FormData(); body.append("file", f);
      await send("/api/upload", body);
      $("file").value = "";
    };
    $("go").onclick = async () => {
      const body = new FormData(); body.append("url", $("url").value);
      if (await send("/api/fetch", body)) $("url").value = "";
    };
    $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
    renderSettings();
  }

  // Only the list is volatile, so only the list gets replaced.
  $("papers").innerHTML = papers.length ? papers.map(paperRow).join("")
    : '<div class="meta">Nothing yet. Add a paper above.</div>';

  document.querySelectorAll("[data-id]").forEach(el =>
    el.onclick = () => { openPaper = el.dataset.id; render(); });
  document.querySelectorAll("[data-cancel]").forEach(el =>
    el.onclick = async (e) => {
      e.stopPropagation();
      await fetch(`/api/papers/${el.dataset.cancel}/cancel`, { method: "POST" });
      render();
    });
  document.querySelectorAll("[data-del]").forEach(el =>
    el.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("Delete this paper and its audio?")) return;
      await fetch(`/api/papers/${el.dataset.del}`, { method: "DELETE" });
      render();
    });
}

async function send(url, body) {
  $("ingestErr").textContent = "";
  const r = await fetch(url, { method: "POST", body });
  if (!r.ok) {
    $("ingestErr").textContent = (await r.json().catch(() => ({}))).detail || "Failed.";
    return false;
  }
  render();
  return true;
}

function paperRow(p) {
  const done = p.status === "ready" || p.status === "failed";
  const queued = p.status === "queued";
  const bar = done || queued ? ""
    : `<div class="bar"><span style="width:${(p.progress*100).toFixed(0)}%"></span></div>`;
  const line = p.status === "failed" ? `<span style="color:var(--bad)">failed — ${esc(p.error)}</span>`
    : p.status === "ready" ? `ready · ${clock(p.duration_s)} · ${p.figures.length} figures`
    : queued ? `waiting — #${p.queue_position} in the queue`
    : `${esc(p.status)} — ${esc(p.detail)}`;
  const act = queued ? `<button class="chip act" data-cancel="${p.id}">cancel</button>`
    : done ? `<button class="chip act" data-del="${p.id}">delete</button>` : "";
  return `<div class="paper">
    <div class="prow">
      <div data-id="${p.id}" style="flex:1;min-width:0;cursor:pointer">
        <h3>${esc(p.title)}</h3><div class="meta">${line}</div>${bar}
      </div>${act}
    </div></div>`;
}

async function renderPaper() {
  const p = await (await fetch(`/api/papers/${openPaper}`)).json();
  if (p.status !== "ready") {
    $("view").innerHTML = `<button class="back" id="back">← all papers</button>
      <div class="card"><h3>${esc(p.title)}</h3>
      <div class="meta">${esc(p.detail || p.status)}</div>
      <div class="bar"><span style="width:${(p.progress*100).toFixed(0)}%"></span></div>
      ${p.error ? `<div class="err">${esc(p.error)}</div>` : ""}</div>`;
    $("back").onclick = () => { openPaper = null; render(); };
    return;
  }
  const figs = p.figures.filter(f => f.start_s != null).sort((a,b) => a.start_s - b.start_s);
  $("view").innerHTML = `
    <button class="back" id="back">← all papers</button>
    <div class="card">
      <h3>${esc(p.title)}</h3>
      <div id="figslot"></div>
      <audio id="au" controls preload="metadata" src="/api/papers/${p.id}/audio"></audio>
      <div class="row" style="align-items:center;gap:10px">
        <div style="flex:0 0 auto" class="meta">Speed</div>
        <input type="range" id="rate" min="0.75" max="2" step="0.05" value="1" style="flex:1">
        <div style="flex:0 0 44px" class="meta" id="rateLabel">1.00×</div>
      </div>
      <button class="ptt" id="ptt">Hold to ask</button>
      <div class="meta" id="pttHint" style="margin-top:6px">
        <span class="mic" id="micDot"></span><span id="micState">Tap and hold to ask</span>.
        Try "go back two minutes", "repeat that section", "show me figure 3", or just ask.
      </div>
      <div class="convo" id="convo"></div>
      <div class="hr"></div>
      <div class="chips">
        ${p.chapters.map(c => `<button class="chip" data-t="${c.start_s}">${esc(c.title)}</button>`).join("")}
        ${figs.map(f => `<button class="chip fig" data-t="${f.start_s}">${esc(f.label)}</button>`).join("")}
      </div>
    </div>`;

  const au = $("au");
  au.currentTime = p.resume_s || 0;
  $("back").onclick = () => { openPaper = null; render(); };
  $("rate").oninput = (e) => { au.playbackRate = +e.target.value; $("rateLabel").textContent = (+e.target.value).toFixed(2)+"×"; };
  document.querySelectorAll("[data-t]").forEach(el =>
    el.onclick = () => { au.currentTime = +el.dataset.t; au.play(); });

  // show the figure whose description is playing — the point of the whole thing
  au.ontimeupdate = () => {
    const current = figs.filter(f => f.start_s <= au.currentTime).pop();
    const next = figs.find(f => f.start_s > au.currentTime);
    const showing = current && (!next || au.currentTime < next.start_s) && au.currentTime - current.start_s < 90
      ? current : null;
    const slot = $("figslot");
    if (slot.dataset.fig === (showing?.id || "")) return;
    slot.dataset.fig = showing?.id || "";
    slot.innerHTML = showing
      ? `<figure><img src="/figures/${openPaper}/figures/${showing.id}.png" alt="${esc(showing.label)}">
         <figcaption>${esc(showing.label)}</figcaption></figure>` : "";
  };
  au.onpause = () => navigator.sendBeacon(`/api/papers/${p.id}/resume`,
    new URLSearchParams({ position: au.currentTime }));

  wireAsking(p, au);
}

// ---- settings ----------------------------------------------------------------
let prefs = null;

const SETTINGS_SPEC = [
  { key: "activation", label: "How to start talking", type: "select",
    options: [["both","Tap or hands-free"],["tap","Tap only"],["handsfree","Hands-free only"]],
    why: "Hands-free listens continuously. Tap is the reliable fallback when it misfires." },
  { key: "vad_sensitivity", label: "Hands-free sensitivity", type: "select",
    options: [["low","Low, fewer false triggers"],["medium","Medium"],["high","High, catches quiet speech"]],
    why: "Lower it if road noise keeps interrupting the narration." },
  { key: "echo_rejection", label: "Ignore the narration's own voice", type: "toggle",
    why: "Discards anything matching the words being narrated at that moment." },
  { key: "answer_depth", label: "Answer depth", type: "select",
    options: [["fast","Fast, about 3 seconds"],["thorough","Thorough, about 50 seconds"]],
    why: "Thorough measured 13x slower with no gain on questions the passage already answers." },
  { key: "stt_model", label: "Speech recognition model", type: "select",
    options: [["tiny.en","Tiny, about 1.8s"],["base.en","Base, about 2.4s"],["small.en","Small, about 5.4s"]],
    why: "Larger is more accurate on technical terms but slower. Switching reloads the model once." },
  { key: "speak_answers", label: "Read answers aloud", type: "toggle",
    why: "Turn off to read answers on screen without spoken playback." },
  { key: "auto_resume", label: "Resume narration after answering", type: "toggle",
    why: "Picks up exactly where it paused." },
  { key: "keep_screen_awake", label: "Keep the screen awake", type: "toggle",
    why: "Needed in a car: browsers cut microphone access when the screen sleeps." },
  { key: "offline_download", label: "Download audio for offline", type: "toggle",
    why: "Caches the paper so dead spots do not stall playback. About 10MB each." },
];

async function renderSettings() {
  prefs = await (await fetch("/api/settings")).json();
  $("settingsBody").innerHTML = SETTINGS_SPEC.map(s => {
    const control = s.type === "toggle"
      ? `<label class="sw"><input type="checkbox" data-k="${s.key}" ${prefs[s.key] ? "checked" : ""}><span></span></label>`
      : `<select data-k="${s.key}">${s.options.map(([v,t]) =>
          `<option value="${v}" ${prefs[s.key]===v?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
    return `<div class="srow"><label>${esc(s.label)}<span class="why">${esc(s.why)}</span></label>${control}</div>`;
  }).join("");
  $("settingsBody").querySelectorAll("[data-k]").forEach(el =>
    el.onchange = async () => {
      const value = el.type === "checkbox" ? el.checked : el.value;
      prefs = await (await fetch("/api/settings", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ [el.dataset.k]: value })
      })).json();
      applyWakeLock();
    });
}

// ---- keep the screen awake ------------------------------------------------------
let wakeLock = null;
async function applyWakeLock() {
  try {
    if (prefs?.keep_screen_awake && !wakeLock && "wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!prefs?.keep_screen_awake && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch { /* denied or unsupported; playback still works */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") applyWakeLock();
});

// ---- asking, by tap or hands-free ----------------------------------------------
let history = [], reply = new Audio(), handsFree = null, busy = false;

const VAD_THRESHOLDS = { low: 0.055, medium: 0.030, high: 0.016 };
const SILENCE_MS = 900;     // quiet this long means the sentence finished
const MIN_SPEECH_MS = 350;  // shorter is a cough, a door, a bump in the road
const PREROLL_MS = 600;     // audio kept before the trigger, so no word is clipped

function addTurn(who, text, cls) {
  const el = document.createElement("div");
  el.className = `turn ${cls}`;
  el.innerHTML = `<span class="who">${esc(who)}</span>${esc(text)}`;
  $("convo").append(el);
  el.scrollIntoView({ block: "nearest" });
  return el;
}

async function submitUtterance(paper, au, blob, wasPlaying) {
  if (busy) return;
  busy = true;
  const body = new FormData();
  body.append("audio", blob, "q.webm");
  body.append("position", au.currentTime);
  body.append("history", JSON.stringify(history.slice(-6)));
  body.append("playing", wasPlaying ? "true" : "false");

  let data;
  try {
    const r = await fetch(`/api/papers/${paper.id}/listen`, { method: "POST", body });
    data = await r.json();
    if (!r.ok) throw new Error(data.detail || "request failed");
  } catch (err) {
    addTurn("Reader", `Could not process that: ${err.message}`, "reader");
    busy = false;
    return;
  }

  // Echo, or nothing intelligible. Say nothing and leave the narration alone: reacting
  // out loud to every sentence it reads would make hands-free unusable.
  if (data.kind === "echo" || (!data.transcript && !data.say)) { busy = false; return; }

  au.pause();
  if (data.transcript) addTurn("You", data.transcript, "you");
  if (data.say) {
    addTurn("Reader", data.say, "reader");
    history.push({ role: "user", content: data.transcript });
    history.push({ role: "assistant", content: data.say });
  }
  if (data.action === "seek") au.currentTime = data.position;
  if (data.action === "show_figure" && data.figure) {
    const slot = $("figslot");
    slot.dataset.fig = "manual";
    slot.innerHTML = `<figure><img src="/figures/${paper.id}/figures/${data.figure.id}.png"
      alt="${esc(data.figure.label)}"><figcaption>${esc(data.figure.label)}</figcaption></figure>`;
  }

  const resume = () => { if (prefs?.auto_resume && data.action !== "pause") au.play(); };
  if (data.say && prefs?.speak_answers && data.action !== "pause") {
    try {
      const spoken = new FormData(); spoken.append("text", data.say);
      const r = await fetch("/api/speak", { method: "POST", body: spoken });
      if (r.ok) {
        reply.src = URL.createObjectURL(await r.blob());
        reply.onended = resume;
        await reply.play();
        busy = false;
        return;
      }
    } catch { /* fall through and just resume */ }
  }
  resume();
  busy = false;
}

function wireAsking(paper, au) {
  const btn = $("ptt");
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    btn.disabled = true;
    btn.textContent = "Microphone not available";
    $("micState").textContent = "This browser will not give us a microphone";
    return;
  }
  applyWakeLock();

  const mode = prefs?.activation || "both";
  if (mode === "handsfree") { btn.style.display = "none"; }
  else wireTapToTalk(paper, au, btn);
  if (mode !== "tap") startHandsFree(paper, au);
  else $("micState").textContent = "Tap and hold to ask";
}

function wireTapToTalk(paper, au, btn) {
  let recorder = null, chunks = [];
  const start = async (e) => {
    e.preventDefault();
    if (recorder || busy) return;
    au.pause(); reply.pause();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true } }); }
    catch { btn.textContent = "Microphone blocked"; return; }
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
    recorder.start();
    btn.classList.add("live"); btn.textContent = "Listening, release to send";
  };
  const stop = async (e) => {
    e.preventDefault();
    if (!recorder) return;
    const active = recorder; recorder = null;
    btn.classList.remove("live"); btn.textContent = "Thinking"; btn.disabled = true;
    await new Promise((r) => { active.onstop = r; active.stop(); });
    active.stream.getTracks().forEach((t) => t.stop());
    await submitUtterance(paper, au, new Blob(chunks, { type: "audio/webm" }), false);
    btn.disabled = false; btn.textContent = "Hold to ask";
  };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", stop);
  btn.addEventListener("pointercancel", stop);
  btn.addEventListener("pointerleave", (e) => { if (recorder) stop(e); });
}

// Continuous listening. One recorder runs for the whole session and its chunks are kept
// in a short rolling buffer, so when speech is detected the words already spoken are
// still available -- opening a fresh stream on each trigger clipped the first syllable.
//
// The narration is NOT paused when speech is detected, only once the server confirms it
// was really the listener. Pausing on every trigger would stutter the audio each time a
// passenger spoke or the road got loud.
async function startHandsFree(paper, au) {
  if (handsFree) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch {
    $("micState").textContent = "Microphone blocked, tap and hold instead";
    return;
  }

  const ctx = new AudioContext();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);

  const recorder = new MediaRecorder(stream);
  let ring = [];
  recorder.ondataavailable = (ev) => {
    if (!ev.data.size) return;
    ring.push({ at: performance.now(), blob: ev.data });
    const keep = performance.now() - 30000;
    while (ring.length && ring[0].at < keep) ring.shift();
  };
  recorder.start(200);
  handsFree = { stream, ctx, recorder };

  let speaking = false, speechStart = 0, lastLoud = 0, floor = 0.01;
  $("micState").textContent = "Listening, just talk";

  const tick = () => {
    if (!handsFree) return;
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const level = Math.sqrt(sum / buf.length);

    // A car has a constant broadband hum, so the threshold tracks the noise floor
    // rather than sitting at a fixed value that would either ignore speech or fire
    // continuously depending on the road surface.
    floor = level < floor ? floor * 0.95 + level * 0.05 : floor * 0.999 + level * 0.001;
    const threshold = Math.max(VAD_THRESHOLDS[prefs?.vad_sensitivity || "medium"], floor * 2.5);
    const now = performance.now();

    if (level > threshold) {
      lastLoud = now;
      if (!speaking && !busy) { speaking = true; speechStart = now; $("micDot").classList.add("hot"); }
    } else if (speaking && now - lastLoud > SILENCE_MS) {
      speaking = false;
      $("micDot").classList.remove("hot");
      if (lastLoud - speechStart >= MIN_SPEECH_MS) {
        const from = speechStart - PREROLL_MS;
        const clip = ring.filter((c) => c.at >= from).map((c) => c.blob);
        if (clip.length) submitUtterance(paper, au, new Blob(clip, { type: "audio/webm" }), !au.paused);
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function stopHandsFree() {
  if (!handsFree) return;
  try { handsFree.recorder.stop(); } catch { /* already stopped */ }
  handsFree.stream.getTracks().forEach((t) => t.stop());
  handsFree.ctx.close();
  handsFree = null;
}

async function render() {
  clearInterval(timer);
  if (!openPaper) stopHandsFree();   // leaving the player releases the microphone
  await (openPaper ? renderPaper() : renderList());
  // keep polling while anything is queued (no bar yet) or actively processing
  if (document.querySelector(".bar, [data-cancel]")) timer = setInterval(render, 2500);
}

refreshStatus(); setInterval(refreshStatus, 15000); render();
</script>
</body>
</html>
