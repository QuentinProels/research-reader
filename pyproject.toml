[project]
name = "research-reader"
version = "0.1.0"
description = "Ingests research papers and narrates them as audio, figures included."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "kokoro-onnx>=0.4",
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
